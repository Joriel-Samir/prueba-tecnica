services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-actividades}
      POSTGRES_USER: ${DB_USER:-actividades}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD debe definirse en .env}"
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-actividades} -d ${DB_NAME:-actividades}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY debe definirse en .env}"
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DB_NAME: ${DB_NAME:-actividades}
      DB_USER: ${DB_USER:-actividades}
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD debe definirse en .env}"
      DB_HOST: db
      DB_PORT: "5432"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_data:
