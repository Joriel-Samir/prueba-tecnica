stages:
  - lint
  - test
  - build

lint:
  stage: lint
  image: python:3.12-slim
  script:
    - cd backend/4-api
    - pip install ruff
    - ruff check .

test:
  stage: test
  image: python:3.12-slim
  services:
    - postgres:16
  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: "$CI_JOB_TOKEN"
    DB_NAME: test_db
    DB_USER: test_user
    DB_PASSWORD: "$CI_JOB_TOKEN"
    DB_HOST: postgres
    DB_PORT: "5432"
  script:
    - cd backend/4-api
    - pip install -r requirements-dev.txt
    - pytest --cov=apps --cov-fail-under=80

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build -t actividades-api backend/4-api
