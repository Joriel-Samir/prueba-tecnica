# Plantilla sin secretos reales. Cree el Secret con kubectl antes del despliegue:
# kubectl -n demo create secret generic demo-backend-secrets \
#   --from-literal=SECRET_KEY='<valor-fuerte>' \
#   --from-literal=DB_PASSWORD='<password-postgres>' \
#   --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: demo-backend-secrets
  namespace: demo
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_BEFORE_APPLY"
  DB_PASSWORD: "REPLACE_BEFORE_APPLY"
